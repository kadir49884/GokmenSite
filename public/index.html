<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="İş önlüğü, iş takımı ve iş pantolonu üretimi. Alpaka ve Gabardin kumaş, tüm bedenler ve renk seçenekleri." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Ürünler</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <a class="logo" href="/" data-company>Bayram İş Kıyafetleri</a>
        <nav>
          <a href="/">Ürünler</a>
          <a href="/iletisim.html">İletişim</a>
          <a href="/admin.html">Yönetim</a>
        </nav>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <h1 data-company>Bayram İş Kıyafetleri</h1>
        <p data-slogan></p>
        <div class="actions" id="hero-actions"></div>
      </div>
    </section>

    <main class="container">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Ürün kodu veya adı ile ara" />
        <label class="checkbox">
          <input id="only-in-stock" type="checkbox" />
          Sadece stokta olanlar
        </label>
      </div>

      <div id="categories" class="chip-row"></div>

      <div id="message" class="message hidden"></div>
      <div id="product-list" class="product-grid"></div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script type="module" src="/js/store.js"></script>
  </body>
</html>
